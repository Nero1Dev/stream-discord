<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream de Tela</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23bf1821'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <span class="eyebrow">● Transmissão de tela</span>
      <h1 id="title">Sua tela, <em>ao vivo</em>.</h1>
      <p class="lead" id="subtitle">Gere um link, mande pros amigos e transmita direto do navegador. Sem instalar nada.</p>
    </section>

    <!-- Quem transmite -->
    <section id="host" class="panel" hidden>
      <div class="link-box">
        <span class="label">Seu link</span>
        <div class="link-row">
          <input id="shareLink" readonly value="Gerando link…">
          <button id="copyBtn" class="btn btn-outline" disabled>Copiar</button>
        </div>
      </div>

      <div class="controls">
        <label>
          <span class="label">Qualidade</span>
          <select id="quality">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
          </select>
        </label>
        <label>
          <span class="label">FPS</span>
          <select id="fps">
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </label>
        <div class="spacer"></div>
        <button id="startBtn" class="btn btn-primary">Compartilhar tela →</button>
        <button id="stopBtn" class="btn btn-danger" hidden>Parar transmissão</button>
      </div>

      <p class="status"><span id="hostStatus">Conectando ao servidor…</span> <span class="dot">·</span> <b id="viewerCount">0</b> assistindo</p>
    </section>

    <!-- Quem assiste -->
    <section id="viewer" class="panel" hidden>
      <p class="status" id="viewerStatus">Conectando…</p>
    </section>

    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <span class="live-pill" id="livePill" hidden><i></i> AO VIVO</span>
      <div class="placeholder" id="placeholder">
        <span class="placeholder-icon"></span>
        <span id="placeholderText">Nenhuma transmissão ainda</span>
      </div>
      <div class="video-actions">
        <button id="unmuteBtn" class="btn btn-glass" hidden>🔊 Ativar som</button>
        <button id="fullscreenBtn" class="btn btn-glass" hidden>⛶ Tela cheia</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
