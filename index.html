<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream de Tela</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23bf1821'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <span class="eyebrow">● Transmissão de tela</span>
      <h1 id="title">Sua tela, <em>ao vivo</em>.</h1>
      <p class="lead" id="subtitle">Gere um link, mande pros amigos e revezem quem compartilha a tela. Direto do navegador, sem instalar nada.</p>
    </section>

    <section class="panel">
      <div class="link-box">
        <span class="label">Link da sala</span>
        <div class="link-row">
          <input id="shareLink" readonly value="Gerando link…">
          <button id="copyBtn" class="btn btn-outline" disabled>Copiar</button>
        </div>
      </div>

      <div class="controls">
        <label class="grow">
          <span class="label">Seu nome</span>
          <input id="name" maxlength="24" autocomplete="nickname">
        </label>
        <label>
          <span class="label">Qualidade</span>
          <select id="quality">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
          </select>
        </label>
        <label>
          <span class="label">FPS</span>
          <select id="fps">
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </label>
        <button id="shareBtn" class="btn btn-primary" disabled>Compartilhar tela →</button>
        <button id="cancelBtn" class="btn btn-outline" hidden>Cancelar pedido</button>
        <button id="stopBtn" class="btn btn-danger" hidden>Parar de compartilhar</button>
      </div>

      <div id="requests" class="requests" hidden></div>

      <p class="status" id="status">Conectando ao servidor…</p>
      <ul id="people" class="people"></ul>
    </section>

    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <span class="live-pill" id="livePill" hidden><i></i> AO VIVO</span>
      <span class="presenter-tag" id="presenterTag" hidden></span>
      <div class="placeholder">
        <span class="placeholder-icon"></span>
        <span id="placeholderText">Ninguém está compartilhando ainda</span>
      </div>
      <div class="video-actions">
        <button id="unmuteBtn" class="btn btn-glass" hidden>🔊 Ativar som</button>
        <button id="fullscreenBtn" class="btn btn-glass" hidden>⛶ Tela cheia</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
